name: mpnosale-saas
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${SAAS_DB_NAME:?required}
      POSTGRES_USER: ${SAAS_DB_USER:?required}
      POSTGRES_PASSWORD: ${SAAS_DB_PASSWORD:?required}
    volumes:
      - saas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
  web:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn portal.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports: ["127.0.0.1:8892:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/',headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [internal]
  worker:
    build: .
    env_file: .env
    command: python manage.py run_guard
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; from guard.worker_health import is_healthy; sys.exit(0 if is_healthy('guard', 180) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks: [internal]
  reconciliation:
    build: .
    env_file: .env
    command: python manage.py reconcile_tochka
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; from guard.worker_health import is_healthy; sys.exit(0 if is_healthy('reconciliation', 1200) else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks: [internal]
  notifications:
    build: .
    env_file: .env
    command: python manage.py run_notifications
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; from guard.worker_health import is_healthy; sys.exit(0 if is_healthy('notifications', 900) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks: [internal]
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    command: python -m nosale_mcp.server
    restart: unless-stopped
    # Deliberately NO ports: MCP only on the Compose internal network.
    # Real seller session auth is delegated through short-lived signed bearer.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8099), 2); s.close()"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [internal]
  backup:
    image: postgres:16-alpine
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${SAAS_DB_NAME:?required}
      PGUSER: ${SAAS_DB_USER:?required}
      PGPASSWORD: ${SAAS_DB_PASSWORD:?required}
    volumes:
      - saas_pg_backups:/backups
    depends_on:
      db: {condition: service_healthy}
    command: sh -c 'while true; do pg_dump -Fc -f "/backups/saas-$$(date +%Y%m%d-%H%M%S).dump" && find /backups -name "*.dump" -mtime +13 -delete; sleep 86400; done'
    restart: unless-stopped
    networks: [internal]
networks:
  internal: {}
volumes:
  saas_pg_data: {}
  saas_pg_backups: {}
