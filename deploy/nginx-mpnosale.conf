server {
    listen 80;
    listen [::]:80;
    server_name mpnosale.svdev.pro;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 10443 ssl http2 proxy_protocol;
    listen [::]:10443 ssl http2 proxy_protocol;
    server_name mpnosale.svdev.pro;
    ssl_certificate /etc/letsencrypt/live/mpnosale.svdev.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mpnosale.svdev.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 256k;

    location ~ ^/(register|login|password-reset|admin/login)/ {
        limit_req zone=mpnosale_auth burst=15 nodelay;
        proxy_pass http://127.0.0.1:8891;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8891;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
