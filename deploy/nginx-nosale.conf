# Staging HTTPS virtual host for the independent MP NoSale SaaS runtime.
server {
    listen 80;
    listen [::]:80;
    server_name nosale.svdev.pro;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 10443 ssl http2 proxy_protocol;
    listen [::]:10443 ssl http2 proxy_protocol;
    server_name nosale.svdev.pro;
    ssl_certificate /etc/letsencrypt/live/nosale.svdev.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nosale.svdev.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 256k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ~ ^/(register|login|password-reset|auth/code|auth/pin|admin/login|connect/wb)/ {
        limit_req zone=mpnosale_auth_ppaddr_v2 burst=15 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://127.0.0.1:8892;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://127.0.0.1:8892;
    }
}
